    <style>
      body {
        background-color: white;

      .container {
        width: 1200px;

      .contact {
        float: right;

        border-radius: 18px;
      }

      ul {
        list-style-type: none;
        padding: 0;
        margin-top: 50px;
        padding-bottom: 20px;
        border-bottom: 1px solid black;
      }

      li {
        display: inline-block;
        margin-right: 38px;

      a {

        font-size: 16px;
        text-decoration: none;
      }

      }

      a:active {

      }
      
      .item {

        display: inline-block;
        text-align: center;

        margin-top: 50px;
        margin-bottom: 100px;
      }
  
      .new-row {
        clear: left;
      }
      
      h2 {
        font-family: 'Mulish', sans-serif;
        font-size: 16px;
        font-weight: 600;
        margin-top: 13px;
        margin-bottom: 10px;
      }

      p {
        font-family: 'Mulish', sans-serif;
        font-size: 16px;
        font-weight: 400;
        margin: 0;
      }
      
      .item h2, .item p,
      .itemother h2, .itemother p {
        visibility: hidden;
      }

      .item:hover h2, .item:hover p,
      .itemother:hover h2, .itemother:hover p {
        visibility: visible;
      }
      
      .footer {
        text-align: left;
        border-top: 1px solid black;
        padding-top: 50px;
        padding-bottom: 100px;
      }
      
      .smiley {
        float: right;
      }
