<!DOCTYPE html>
<html>
  <head>
    <title>materialism 101</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Brawler:wght@400;700&family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Didact+Gothic&family=Inclusive+Sans:ital,wght@0,300..700;1,300..700&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Rethink+Sans:ital,wght@0,400..800;1,400..800&family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&family=Yellowtail&family=Yomogi&display=swap" rel="stylesheet">
    
    <style>
      body {
        background-color: white;
      }
      
      .container {
        width: 1200px;
        margin: auto;
        padding-top: 100px;
      }
      
      .contact {
        float: right;
        margin-right: 0;
        border: 1px solid black;
        padding: 5px 10px;
        border-radius: 18px;
      }

      ul {
        list-style-type: none;
        padding: 0;
        margin-top: 50px;
        padding-bottom: 20px;
        border-bottom: 1px solid black;
      }

      li {
        display: inline-block;
        margin-right: 38px;
      }
      a {
        font-family: 'Mulish', sans-serif;
        font-size: 16px;
        text-decoration: none;
      }

      a:link {
        color: black;
      }

      a:visited {
        color: black;
      }

      a:hover {
        color: gray;
      }

      a:active {
        color: black;
      }
      
      .item {
        width: 295px;
        display: inline-block;
        text-align: center;
        vertical-align: middle;
        margin-top: 50px;
        margin-bottom: 100px;
      }
  
      .new-row {
        clear: left;
      }
      
      h2 {
        font-family: 'Mulish', sans-serif;
        font-size: 16px;
        font-weight: 600;
        margin-top: 13px;
        margin-bottom: 10px;
      }

      p {
        font-family: 'Mulish', sans-serif;
        font-size: 16px;
        font-weight: 400;
        margin: 0;
      }
      
      .item h2, .item p,
      .itemother h2, .itemother p {
        visibility: hidden;
      }

      .item:hover h2, .item:hover p,
      .itemother:hover h2, .itemother:hover p {
        visibility: visible;
      }
      
      .footer {
        text-align: left;
        border-top: 1px solid black;
        padding-top: 50px;
        padding-bottom: 100px;
      }
      
      .smiley {
        float: right;
      }
    </style>
  </head>

  <body>
